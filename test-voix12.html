<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test voix Seeker</title>
<script type="importmap">{"imports":{"onnxruntime-web/wasm":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js","onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js"}}</script>
<style>
body{margin:0;background:#061b26;color:#d2eef3;font:16px system-ui;padding:18px;line-height:1.45}
h2{margin:0 0 6px}p.s{color:#9ccbd8;font-size:14px;margin:4px 0 14px}
label{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6fd3e6}
select,textarea,button{width:100%;box-sizing:border-box;background:#0b3550;color:#e8fdff;border:1px solid #2a7590;border-radius:8px;padding:12px;font-size:16px}
textarea{min-height:84px}button{background:#2a7590;border:0;margin-top:12px}button:disabled{opacity:.5}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fx button{margin:0;background:#0b3550;border:1px solid #2a7590}.fx button.on{background:#6fd3e6;color:#04141f}
#log{white-space:pre-wrap;font:13px ui-monospace,monospace;color:#9ccbd8;margin-top:14px;background:#04141f;padding:10px;border-radius:8px;min-height:60px}
</style></head><body>
<h2>Test voix de Seeker <small style="font-size:12px;color:#6fd3e6">· page v13 (robot/radio corrigés)</small></h2>
<p class="s">Voix générées par le téléphone lui-même (moteur Piper), puis passées dans des filtres. Rien n'est envoyé nulle part.</p>
<label>Voix</label><select id="v"><option>Chargement de la liste…</option></select>
<label>Texte</label><textarea id="t">Constantes stables. Je suis là, Exo. Le point de saut est dégagé, on peut y aller quand tu veux.</textarea>
<button id="gen">1 · Générer la voix</button>
<label>Filtre (touche pour écouter)</label>
<div class="fx" id="fx"></div>
<button id="cat" style="background:#2a6a3a">3 · CATALOGUE : générer 10 voix à écouter</button>
<div id="cl" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"></div>
<button id="all" style="background:#7a3a2a">2 · Tester TOUTES les voix (diagnostic)</button>
<div id="st" style="margin-top:10px;color:#6fd3e6">—</div>
<div id="log">En attente.</div>
<script type="module">
// ---- Filtres Seeker v2 (partagé page + test) ----
const FXN={raw:"Brut",grave:"Grave",robot:"Robot",radio:"Radio cockpit",echo:"Station (écho)",ia:"IA froide"};
function fxNoise(c,sec,fn){const n=Math.ceil(c.sampleRate*sec),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(fn?fn(i/n):1);return b;}
function fxIR(c,sec,decay){const n=Math.ceil(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;lp+=(w-lp)*.35;d[i]=lp*Math.pow(1-i/n,decay);}}return b;}
// décaleur de hauteur (la durée ne change pas). f<1 = plus grave
function fxPitch(c,input,f){
  const act=.1,fade=.04,t2=act-fade,sr=c.sampleRate,l1=Math.round(act*sr),l2=Math.round((act-2*fade)*sr),L=l1+l2,fl=Math.round(fade*sr);
  const fb=c.createBuffer(1,L,sr),fd=fb.getChannelData(0),db=c.createBuffer(1,L,sr),dd=db.getChannelData(0);
  for(let i=0;i<l1;i++){fd[i]=i<fl?Math.sqrt(i/fl):(i>=l1-fl?Math.sqrt(1-(i-(l1-fl))/fl):1);dd[i]=i/l1;}
  const span=(1-f)*act,out=c.createGain(),now=c.currentTime+.02,srcs=[];
  [0,t2].forEach(off=>{
    const dl=c.createDelay(.5);dl.delayTime.value=0;
    const mg=c.createGain();mg.gain.value=span;const ds=c.createBufferSource();ds.buffer=db;ds.loop=true;ds.connect(mg);mg.connect(dl.delayTime);
    const fg=c.createGain();fg.gain.value=0;const fs=c.createBufferSource();fs.buffer=fb;fs.loop=true;fs.connect(fg.gain);
    input.connect(dl);dl.connect(fg);fg.connect(out);
    ds.start(now+off);fs.start(now+off);srcs.push(ds,fs);
  });
  return {out,stop:()=>srcs.forEach(s=>{try{s.stop()}catch(_){}})};
}
// construit la chaîne et retourne {stops:[...]}; dur = durée de la voix en s
function fxBuild(c,src,k,dest,dur){
  const stops=[];
  const sh=(type,fq,g,q)=>{const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;if(g!=null)f.gain.value=g;if(q!=null)f.Q.value=q;return f;};
  const comp=()=>{const d=c.createDynamicsCompressor();d.threshold.value=-24;d.ratio.value=6;d.attack.value=.003;d.release.value=.2;return d;};
  const wet=(g)=>{const x=c.createGain();x.gain.value=g;return x;};
  if(k==="raw"){src.connect(dest);return stops;}
  if(k==="grave"){
    const p=fxPitch(c,src,.72);stops.push(p.stop);
    const ls=sh("lowshelf",220,9),hs=sh("highshelf",3500,-5),cp=comp();
    p.out.connect(ls);ls.connect(hs);hs.connect(cp);const g=wet(.85);cp.connect(g);g.connect(dest);return stops;}
  if(k==="robot"){
    // trémolo rapide (grésillement) + peigne métallique + voix réduite en paliers : reste intelligible
    const o=c.createOscillator();o.type="sine";o.frequency.value=70;const od=wet(.42);const am=c.createGain();am.gain.value=.58;o.connect(od);od.connect(am.gain);o.start();stops.push(()=>{try{o.stop()}catch(_){}});
    const cr=c.createWaveShaper();const cvv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;cvv[i]=Math.round(x*20)/20;}cr.curve=cvv;
    const hp=sh("highpass",200),pk=sh("peaking",1400,6,1.2),mix=c.createGain();
    src.connect(hp);hp.connect(cr);cr.connect(am);am.connect(pk);pk.connect(mix);
    const d=c.createDelay(.05);d.delayTime.value=.0045;const fbk=wet(.45);d.connect(fbk);fbk.connect(d);pk.connect(d);d.connect(wet(.5)).connect(mix);
    const cp=comp(),g=wet(.95);mix.connect(cp);cp.connect(g);g.connect(dest);return stops;}
  if(k==="radio"){
    const hp=sh("highpass",380,null,.7),lp=sh("lowpass",3300,null,.7),pk=sh("peaking",1900,5,1);
    const ws=c.createWaveShaper();const cv=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;cv[i]=Math.tanh(x*2.2)*.95;}ws.curve=cv;
    const cp=comp(),g=wet(.95);src.connect(hp);hp.connect(pk);pk.connect(ws);ws.connect(lp);lp.connect(cp);cp.connect(g);g.connect(dest);
    const nz=c.createBufferSource();nz.buffer=fxNoise(c,dur+.4);const nb=sh("bandpass",2400,null,.5),ng=wet(.018);nz.connect(nb);nb.connect(ng);ng.connect(dest);
    const t0=c.currentTime+.02;nz.start(t0);stops.push(()=>{try{nz.stop()}catch(_){}});
    [0,dur+.1].forEach(t=>{const b=c.createBufferSource();b.buffer=fxNoise(c,.07,x=>Math.pow(1-x,2));const bb=sh("bandpass",2000,null,.5),bg=wet(.22);b.connect(bb);bb.connect(bg);bg.connect(dest);b.start(t0+t);stops.push(()=>{try{b.stop()}catch(_){}});});
    return stops;}
  if(k==="echo"){
    const hp=sh("highpass",120),dry=wet(.9);src.connect(hp);hp.connect(dry);dry.connect(dest);
    const cv=c.createConvolver();cv.buffer=fxIR(c,2.6,2.2);const rg=wet(.55);hp.connect(cv);cv.connect(rg);rg.connect(dest);
    const d=c.createDelay(1);d.delayTime.value=.21;const f=wet(.4),lp=sh("lowpass",2600),eg=wet(.45);hp.connect(d);d.connect(lp);lp.connect(f);f.connect(d);lp.connect(eg);eg.connect(dest);return stops;}
  if(k==="ia"){
    const p=fxPitch(c,src,.89);stops.push(p.stop);
    const mix=c.createGain();p.out.connect(mix);
    const d=c.createDelay(.1);d.delayTime.value=.012;const l=c.createOscillator();l.frequency.value=.4;const lg=wet(.003);l.connect(lg);lg.connect(d.delayTime);l.start();stops.push(()=>{try{l.stop()}catch(_){}});p.out.connect(d);d.connect(wet(.35)).connect(mix);
    const hs=sh("highshelf",3000,5),lp=sh("lowpass",7500),og=wet(.8);mix.connect(hs);hs.connect(lp);lp.connect(og);og.connect(dest);return stops;}
  src.connect(dest);return stops;
}

const $=i=>document.getElementById(i),log=t=>{$("log").textContent=t};
let tts=null,buf=null,ctx=null,cur="raw",src=null,tgen=0;
const FX=FXN;
$("fx").innerHTML=Object.entries(FX).map(([k,n])=>`<button data-k="${k}" class="${k==="raw"?"on":""}">${n}</button>`).join("");

const HF="https://huggingface.co/diffusionstudio/piper-voices/resolve/main/";
let DEF=null,VM=null,DROP=0,JP=JSON.parse.bind(JSON);
JSON.parse=function(t,r){const o=JP(t,r);
  try{if(o&&o.phoneme_ids&&DEF&&VM){const out=[],P=VM["_"]?VM["_"][0]:0;
    const b=VM["^"],e=VM["$"];if(b)out.push(b[0],P);
    for(const id of o.phoneme_ids){const ph=DEF[id];if(ph===undefined||ph==="_"||ph==="^"||ph==="$")continue;
      const v=VM[ph];if(!v){DROP++;continue;}for(const x of v){out.push(x,P);}}
    if(e)out.push(e[0]);o.phoneme_ids=out;}}catch(_){}
  return o;};
async function prep(id){
  if(tts&&tts.TtsSession&&id!==window.__lastV){tts.TtsSession._instance=null;}window.__lastV=id;
  if(!DEF){const j=await (await fetch(HF+"en/en_US/lessac/medium/en_US-lessac-medium.onnx.json")).json();DEF={};
    for(const [ph,ids] of Object.entries(j.phoneme_id_map))DEF[ids[0]]=ph;}
  const m=id.match(/^(fr_FR)-(.+)-(low|medium|high|x_low)$/);
  const vj=await (await fetch(HF+"fr/fr_FR/"+m[2]+"/"+m[3]+"/"+id+".onnx.json")).json();
  VM=vj.phoneme_id_map;DROP=0;
}
const FALL=["fr_FR-siwis-medium","fr_FR-tom-medium","fr_FR-upmc-medium","fr_FR-gilles-low","fr_FR-siwis-low"];
async function init(){
  log("Chargement du moteur de voix (première fois : peut prendre un moment)…");
  try{
    tts=await import("https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/dist/piper-tts-web.js");
  }catch(e){log("Échec du chargement du moteur : "+e.message+"\nEnvoie-moi une capture de cet écran.");return;}
  try{const ort=await import("onnxruntime-web/wasm");const oc=ort.InferenceSession.create.bind(ort.InferenceSession);
    ort.InferenceSession.create=async function(...a){const se=await oc(...a);const r=se.run.bind(se);
      se.run=(f,...z)=>{if(f&&f.sid&&window.SID!=null){f=Object.assign({},f,{sid:new ort.Tensor("int64",BigInt64Array.from([BigInt(window.SID)]),[1])});}return r(f,...z);};return se;};}catch(e){}
  let list=[];
  try{const v=await tts.voices();const a=Array.isArray(v)?v:Object.values(v);
    list=a.filter(x=>(x.key||x.id||"").startsWith("fr_FR")||(x.language&&x.language.code==="fr_FR")).map(x=>x.key||x.id);}catch(e){}
  if(!list.length)list=FALL;
  $("v").innerHTML=list.map(k=>`<option value="${k}">${k}</option>`).join("");
  log("Moteur prêt. "+list.length+" voix françaises. Choisis une voix, puis « Générer ».");
}
$("gen").onclick=async()=>{
  if(!tts)return;$("gen").disabled=true;stop();
  const id=$("v").value,txt=$("t").value.trim();if(!txt){$("gen").disabled=false;return;}
  const t0=performance.now(),el=()=>((performance.now()-t0)/1000).toFixed(1)+"s";
  let lines=["Voix : "+id,"Isolation cross-origin : "+self.crossOriginIsolated,"Coeurs : "+navigator.hardwareConcurrency];
  const show=()=>log(lines.join("\n"));
  const tick=setInterval(show,500);
  const W=(p,ms,n)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("Délai dépassé ("+ms/1000+" s) à l'étape : "+n)),ms))]);
  window.addEventListener("error",e=>{lines.push("ERREUR JS : "+e.message)});
  window.addEventListener("unhandledrejection",e=>{lines.push("ERREUR PROMESSE : "+(e.reason&&e.reason.message||e.reason))});
  try{
    lines.push("[A] Téléchargement de la voix…");
    let k=lines.length-1;
    await prep(id);await W(tts.download(id,p=>{if(p&&p.total)lines[k]="[A] Téléchargement : "+Math.round(100*p.loaded/p.total)+" % ("+Math.round(p.loaded/1048576)+" Mo) "+el();}),90000,"A téléchargement/stockage");
    lines.push("[A] terminé à "+el());
    lines.push("[B] Synthèse (phonémiseur + moteur)…");
    const wav=await W(tts.predict({text:txt,voiceId:id}),120000,"B synthèse");
    lines.push("[B] terminé à "+el());
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    buf=await ctx.decodeAudioData(await wav.arrayBuffer());
    lines.push("OK ! audio de "+buf.duration.toFixed(1)+" s. Touche un filtre.");
    play(cur);
  }catch(e){lines.push("ÉCHEC : "+(e&&e.message||e));}
  clearInterval(tick);show();
  $("gen").disabled=false;
};

$("all").onclick=async()=>{
  if(!tts)return;$("all").disabled=true;$("gen").disabled=true;
  const vs=["fr_FR-siwis-low","fr_FR-siwis-medium","fr_FR-tom-medium","fr_FR-upmc-medium","fr_FR-gilles-low"];
  const txs=["Bonjour.","Je suis là, Exo.","Constantes stables. Le point de saut est dégagé."];
  const out=[];const show=()=>log(out.join("\n"));
  for(const v of vs){
    for(const t of txs){
      out.push("… "+v+" « "+t.slice(0,14)+" »");show();
      try{await prep(v);await Promise.race([tts.predict({text:t,voiceId:v},()=>{}),new Promise((_,r)=>setTimeout(()=>r(new Error("délai 60 s")),60000))]);out[out.length-1]="✔ "+v+" « "+t.slice(0,14)+" »";}
      catch(e){out[out.length-1]="✘ "+v+" « "+t.slice(0,14)+" » : "+String(e&&e.message||e).slice(0,70);}
      show();
    }
  }
  out.push("Terminé.");show();$("all").disabled=false;$("gen").disabled=false;
};

const ENT=[
 {v:"fr_FR-siwis-medium",s:0,n:"Siwis (femme)"},
 {v:"fr_FR-tom-medium",s:0,n:"Tom"},{v:"fr_FR-upmc-medium",s:0,n:"UPMC Jessica"},{v:"fr_FR-upmc-medium",s:1,n:"UPMC Pierre"},
 {v:"fr_FR-gilles-low",s:0,n:"Gilles"},{v:"fr_FR-mls_1840-low",s:0,n:"MLS 1840"},
 {v:"fr_FR-mls-medium",s:0,n:"MLS #0"},{v:"fr_FR-mls-medium",s:1,n:"MLS #1"},{v:"fr_FR-mls-medium",s:2,n:"MLS #2"},{v:"fr_FR-mls-medium",s:3,n:"MLS #3"}];
$("cat").onclick=async()=>{
  if(!tts)return;$("cat").disabled=true;$("gen").disabled=true;$("all").disabled=true;
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const txt=$("t").value.trim()||"Je suis là, Exo.";$("cl").innerHTML="";
  for(let i=0;i<ENT.length;i++){const e=ENT[i];log("Catalogue "+(i+1)+"/"+ENT.length+" : "+e.n+"…\n(téléchargement si première fois)");
    try{window.SID=e.s;await prep(e.v);
      const wav=await Promise.race([tts.predict({text:txt,voiceId:e.v},()=>{}),new Promise((_,r)=>setTimeout(()=>r(new Error("délai 120 s")),120000))]);
      e.buf=await ctx.decodeAudioData(await wav.arrayBuffer());
      const b=document.createElement("button");b.textContent="▶ "+e.n;b.style.margin="0";b.dataset.i=i;$("cl").appendChild(b);
    }catch(err){const b=document.createElement("div");b.style.cssText="color:#e88;font-size:13px";b.textContent="✘ "+e.n+" : "+String(err&&err.message||err).slice(0,60);$("cl").appendChild(b);}
  }
  window.SID=0;log("Catalogue prêt. Touche une voix, puis un filtre.");$("cat").disabled=false;$("gen").disabled=false;$("all").disabled=false;
};
$("cl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const en=ENT[+b.dataset.i];if(!en||!en.buf)return;buf=en.buf;play(cur);$("st").textContent="▶ "+en.n+" — "+FX[cur];};
let stops=[];
function stop(){try{src&&src.stop();}catch(_){}src=null;stops.forEach(f=>f());stops=[];}
function play(k){
  if(!buf)return;cur=k;stop();document.querySelectorAll("#fx button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  const s=ctx.createBufferSource();s.buffer=buf;stops=fxBuild(ctx,s,k,ctx.destination,buf.duration);
  s.start(ctx.currentTime+.02);src=s;$("st").textContent="▶ Lecture : "+FX[k]+" ("+new Date().toLocaleTimeString()+")";
}
$("fx").onclick=e=>{const b=e.target.closest("button");if(b)play(b.dataset.k);};
init();
</script></body></html>
