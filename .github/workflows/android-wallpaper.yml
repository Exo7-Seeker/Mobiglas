name: Fond d'écran 3D (APK Android)

on:
  push:
    branches: [main]
    paths: ['android-wallpaper/**', '.github/workflows/android-wallpaper.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clé de signature (secrets GitHub, jamais dans le dépôt)
        id: cle
        env:
          KS_B64: ${{ secrets.FOND3D_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::Secrets FOND3D_KEYSTORE_B64 / FOND3D_KEYSTORE_MDP absents : APK non publié."; echo "ok=non" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fond3d.keystore"
          echo "ok=oui" >> "$GITHUB_OUTPUT"
      - name: Construire l'APK
        if: steps.cle.outputs.ok == 'oui'
        env:
          VERSION_CODE: ${{ github.run_number }}
          FOND3D_KEYSTORE: ${{ runner.temp }}/fond3d.keystore
          FOND3D_KEYSTORE_MDP: ${{ secrets.FOND3D_KEYSTORE_MDP }}
        run: gradle -p android-wallpaper assembleRelease --no-daemon --stacktrace
      - name: Publier
        if: steps.cle.outputs.ok == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-wallpaper/app/build/outputs/apk/release/app-release.apk mobiglas-fond-3d.apk
          gh release create "fond-ecran-v${{ github.run_number }}" mobiglas-fond-3d.apk \
            --title "Fond d'écran 3D v${{ github.run_number }}" \
            --notes "APK Android du fond d'écran animé en relief (mobiGlas Fond 3D). Installer, ouvrir, importer un fichier .cockpit3d, choisir la scène, Appliquer." \
            --latest
      - name: Copier l'APK sur le site (lien direct exo7-seeker.github.io/Mobiglas/fond3d.apk)
        if: steps.cle.outputs.ok == 'oui'
        run: |
          cp mobiglas-fond-3d.apk fond3d.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fond3d.apk
          git commit -m "APK fond 3D v${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
