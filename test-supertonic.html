<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Supertonic</title>
<style>
body{margin:0;background:#061b26;color:#d2eef3;font:16px system-ui;padding:18px;line-height:1.45}
h2{margin:0 0 6px}label{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6fd3e6}
select,textarea,button{width:100%;box-sizing:border-box;background:#0b3550;color:#e8fdff;border:1px solid #2a7590;border-radius:8px;padding:12px;font-size:16px}
textarea{min-height:70px}button{background:#2a7590;border:0;margin-top:10px}button:disabled{opacity:.5}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fx button{margin:0;background:#0b3550;border:1px solid #2a7590}.fx button.on{background:#6fd3e6;color:#04141f}
#log{white-space:pre-wrap;font:12.5px ui-monospace,monospace;color:#9ccbd8;margin-top:14px;background:#04141f;padding:10px;border-radius:8px;min-height:60px}
.bar{height:8px;background:#0b3550;border-radius:4px;margin-top:6px}.bar i{display:block;height:8px;width:0;background:#6fd3e6;border-radius:4px}
</style></head><body>
<h2>Test Supertonic 3 <small style="font-size:12px;color:#6fd3e6">· page S1</small></h2>
<p style="color:#9ccbd8;font-size:14px;margin:4px 0">Voix d'homme M1 à M5 (et femmes F1 à F5). Téléchargement unique d'environ 400 Mo : reste en Wi-Fi et garde la page ouverte.</p>
<button id="dl">1 · Télécharger et préparer le moteur (≈400 Mo)</button>
<div class="bar"><i id="pb"></i></div>
<label>Voix</label><select id="v"><option>M1</option><option>M2</option><option>M3</option><option>M4</option><option>M5</option><option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>F5</option></select>
<label>Texte</label><textarea id="t">Constantes stables. Je suis là, Exo. Le point de saut est dégagé, on peut y aller quand tu veux.</textarea>
<button id="gen" disabled>2 · Générer la voix</button>
<button id="cat" disabled style="background:#2a6a3a">3 · Générer les 5 voix d'homme à comparer</button>
<div id="cl" class="fx"></div>
<label>Filtre</label><div class="fx" id="fx"></div>
<div id="st" style="margin-top:10px;color:#6fd3e6">—</div>
<div id="log">En attente.</div>
<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.mjs";
// ---- Filtres Seeker v2 (partagé page + test) ----
const FXN={raw:"Brut",grave:"Grave",robot:"Robot",radio:"Radio cockpit",echo:"Ondulant (intonation)",ia:"IA froide"};
function fxNoise(c,sec,fn){const n=Math.ceil(c.sampleRate*sec),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(fn?fn(i/n):1);return b;}
function fxIR(c,sec,decay){const n=Math.ceil(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;lp+=(w-lp)*.35;d[i]=lp*Math.pow(1-i/n,decay);}}return b;}
// décaleur de hauteur (la durée ne change pas). f<1 = plus grave
function fxPitch(c,input,f,lfo){
  const act=.1,fade=.04,t2=act-fade,sr=c.sampleRate,l1=Math.round(act*sr),l2=Math.round((act-2*fade)*sr),L=l1+l2,fl=Math.round(fade*sr);
  const fb=c.createBuffer(1,L,sr),fd=fb.getChannelData(0),db=c.createBuffer(1,L,sr),dd=db.getChannelData(0);
  for(let i=0;i<l1;i++){fd[i]=i<fl?Math.sqrt(i/fl):(i>=l1-fl?Math.sqrt(1-(i-(l1-fl))/fl):1);dd[i]=i/l1;}
  const span=(1-f)*act,out=c.createGain(),now=c.currentTime+.02,srcs=[];
  [0,t2].forEach(off=>{
    const dl=c.createDelay(.5);dl.delayTime.value=0;
    const mg=c.createGain();mg.gain.value=span;if(lfo){const lo=c.createOscillator();lo.frequency.value=lfo.rate;const lg=c.createGain();lg.gain.value=lfo.depth*act;lo.connect(lg);lg.connect(mg.gain);lo.start(now);srcs.push(lo);}const ds=c.createBufferSource();ds.buffer=db;ds.loop=true;ds.connect(mg);mg.connect(dl.delayTime);
    const fg=c.createGain();fg.gain.value=0;const fs=c.createBufferSource();fs.buffer=fb;fs.loop=true;fs.connect(fg.gain);
    input.connect(dl);dl.connect(fg);fg.connect(out);
    ds.start(now+off);fs.start(now+off);srcs.push(ds,fs);
  });
  return {out,stop:()=>srcs.forEach(s=>{try{s.stop()}catch(_){}})};
}
// construit la chaîne et retourne {stops:[...]}; dur = durée de la voix en s
function fxBuild(c,src,k,dest,dur){
  const stops=[];
  const sh=(type,fq,g,q)=>{const f=c.createBiquadFilter();f.type=type;f.frequency.value=fq;if(g!=null)f.gain.value=g;if(q!=null)f.Q.value=q;return f;};
  const comp=()=>{const d=c.createDynamicsCompressor();d.threshold.value=-24;d.ratio.value=6;d.attack.value=.003;d.release.value=.2;return d;};
  const wet=(g)=>{const x=c.createGain();x.gain.value=g;return x;};
  if(k==="raw"){src.connect(dest);return stops;}
  if(k==="grave"){
    const p=fxPitch(c,src,.72);stops.push(p.stop);
    const ls=sh("lowshelf",220,9),hs=sh("highshelf",3500,-5),cp=comp();
    p.out.connect(ls);ls.connect(hs);hs.connect(cp);const g=wet(.85);cp.connect(g);g.connect(dest);return stops;}
  if(k==="robot"){
    // voix nette + modulation en anneau légère + résonance métallique
    const o=c.createOscillator();o.type="sine";o.frequency.value=140;const rg=c.createGain();rg.gain.value=0;o.connect(rg.gain);o.start();stops.push(()=>{try{o.stop()}catch(_){}});
    const mix=c.createGain(),dry=wet(1.0),ring=wet(.32);src.connect(dry);dry.connect(mix);src.connect(rg);rg.connect(ring);ring.connect(mix);
    const d=c.createDelay(.05);d.delayTime.value=.0034;const fbk=wet(.5);d.connect(fbk);fbk.connect(d);src.connect(d);d.connect(wet(.45)).connect(mix);
    const pk=sh("peaking",1500,4,1),cp=comp(),g=wet(.9);mix.connect(pk);pk.connect(cp);cp.connect(g);g.connect(dest);return stops;}
  if(k==="radio"){
    // radio claire : voix nette, un peu "boîte à lunettes", sans souffle qui masque
    const hp=sh("highpass",260,null,.7),lp=sh("lowpass",4200,null,.7),pk=sh("peaking",2200,6,.9),lo=sh("lowshelf",300,-3);
    const ws=c.createWaveShaper();const cv=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;cv[i]=Math.tanh(x*1.6)/Math.tanh(1.6);}ws.curve=cv;
    const cp=comp(),g=wet(.5);src.connect(hp);hp.connect(lo);lo.connect(pk);pk.connect(ws);ws.connect(lp);lp.connect(cp);cp.connect(g);g.connect(dest);
    const t0=c.currentTime+.02;
    [0,dur+.1].forEach(t=>{const b=c.createBufferSource();b.buffer=fxNoise(c,.05,x=>Math.pow(1-x,2));const bb=sh("bandpass",2000,null,.5),bg=wet(.12);b.connect(bb);bb.connect(bg);bg.connect(dest);b.start(t0+t);stops.push(()=>{try{b.stop()}catch(_){}});});
    return stops;}
  if(k==="echo"){
    // intonation : la hauteur monte et descend en continu (voix ondulante)
    const p=fxPitch(c,src,.9,{rate:1.1,depth:.1});stops.push(p.stop);
    const hs=sh("highshelf",3500,2),g=wet(.95);p.out.connect(hs);hs.connect(g);g.connect(dest);return stops;}
  if(k==="ia"){
    const p=fxPitch(c,src,.89);stops.push(p.stop);
    const mix=c.createGain();p.out.connect(mix);
    const d=c.createDelay(.1);d.delayTime.value=.012;const l=c.createOscillator();l.frequency.value=.4;const lg=wet(.003);l.connect(lg);lg.connect(d.delayTime);l.start();stops.push(()=>{try{l.stop()}catch(_){}});p.out.connect(d);d.connect(wet(.35)).connect(mix);
    const hs=sh("highshelf",3000,5),lp=sh("lowpass",7500),og=wet(.8);mix.connect(hs);hs.connect(lp);lp.connect(og);og.connect(dest);return stops;}
  src.connect(dest);return stops;
}

const $=i=>document.getElementById(i);
const lines=[];const L=t=>{lines.push(t);$("log").textContent=lines.slice(-22).join("\n");};
window.addEventListener("error",e=>L("ERREUR JS : "+e.message));window.addEventListener("unhandledrejection",e=>L("ERREUR : "+(e.reason&&e.reason.message||e.reason)));
ort.env.wasm.wasmPaths="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";ort.env.wasm.numThreads=1;
const HFB="https://huggingface.co/Supertone/supertonic-3/resolve/main/";
const FILES=["onnx/duration_predictor.onnx","onnx/text_encoder.onnx","onnx/vector_estimator.onnx","onnx/vocoder.onnx","onnx/unicode_indexer.json"];
const SIZES={"onnx/duration_predictor.onnx":3.7,"onnx/text_encoder.onnx":36.4,"onnx/vector_estimator.onnx":257,"onnx/vocoder.onnx":101,"onnx/unicode_indexer.json":.3};
let S={},IDX=null,ctx=null,buf=null,cur="raw",src=null,stops=[],styles={},entries=[];
$("fx").innerHTML=Object.entries(FXN).map(([k,n])=>`<button data-k="${k}" class="${k==="raw"?"on":""}">${n}</button>`).join("");
async function getFile(path,prog){
  const url=HFB+path;let cache=null;try{cache=await caches.open("supertonic3");}catch(_){}
  if(cache){const hit=await cache.match(url);if(hit){const b=await hit.arrayBuffer();prog&&prog(b.byteLength,b.byteLength);return b;}}
  const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status+" sur "+path);
  const tot=+r.headers.get("content-length")||SIZES[path]*1048576;const rd=r.body.getReader();const parts=[];let n=0;
  for(;;){const x=await rd.read();if(x.done)break;parts.push(x.value);n+=x.value.length;prog&&prog(n,tot);}
  const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}
  if(cache){try{await cache.put(url,new Response(out.buffer.slice(0)));}catch(e){L("(cache non enregistré : "+e.message+")");}}
  return out.buffer;
}
$("dl").onclick=async()=>{
  $("dl").disabled=true;const total=Object.values(SIZES).reduce((a,b)=>a+b,0);let done={};
  try{
    const t0=performance.now();const bufs={};
    for(const f of FILES){L("Téléchargement : "+f);
      bufs[f]=await getFile(f,(n,t)=>{done[f]=n;const sum=Object.values(done).reduce((a,b)=>a+b,0)/1048576;$("pb").style.width=Math.min(100,100*sum/total)+"%";$("st").textContent="Téléchargé : "+Math.round(sum)+" / ~"+Math.round(total)+" Mo";});}
    L("Téléchargement terminé en "+((performance.now()-t0)/1000).toFixed(0)+" s");
    IDX=JSON.parse(new TextDecoder().decode(bufs["onnx/unicode_indexer.json"]));
    L("unicode_indexer : "+(Array.isArray(IDX)?"tableau de "+IDX.length:"objet de "+Object.keys(IDX).length+" clés"));
    for(const [k,f] of [["dp","onnx/duration_predictor.onnx"],["te","onnx/text_encoder.onnx"],["ve","onnx/vector_estimator.onnx"],["vo","onnx/vocoder.onnx"]]){
      L("Chargement du modèle "+k+"…");const t1=performance.now();
      S[k]=await ort.InferenceSession.create(new Uint8Array(bufs[f]),{executionProviders:["wasm"],graphOptimizationLevel:"all"});
      bufs[f]=null;L("  "+k+" prêt en "+((performance.now()-t1)/1000).toFixed(1)+" s · entrées : "+S[k].inputNames.join(", ")+" · sorties : "+S[k].outputNames.join(", "));}
    $("st").textContent="Moteur prêt ✓";$("gen").disabled=false;$("cat").disabled=false;
  }catch(e){L("ÉCHEC préparation : "+(e&&e.message||e));$("dl").disabled=false;}
};
async function style(name){
  if(styles[name])return styles[name];
  const j=await (await fetch(HFB+"voice_styles/"+name+".json")).json();
  const mk=o=>{const d=o.dims;const data=Float32Array.from(o.data.flat(Infinity));return new ort.Tensor("float32",data,d);};
  return styles[name]={ttl:mk(j.style_ttl),dp:mk(j.style_dp)};
}
function prep(text){
  let t=text.normalize("NFKD").replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019\u00b4`]/g,"'").replace(/[\u2013\u2014\u2011]/g,"-").replace(/\s+/g," ").trim();
  if(!/[.!?…。！？]$/.test(t))t+=".";
  return "<fr>"+t+"</fr>";
}
function tokens(s){const ids=[];for(const ch of s){const cp=ch.codePointAt(0);const v=Array.isArray(IDX)?IDX[cp]:IDX[cp];if(v===undefined||v<0){continue;}ids.push(v);}return ids;}
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const FD=(n,s)=>{const f=S[n].inputNames;return f;};
async function synth(text,voice,steps=5,speed=1.05){
  const st=await style(voice);const tx=prep(text);const ids=tokens(tx);if(!ids.length)throw new Error("texte vide après filtrage");
  const T=ids.length;const text_ids=new ort.Tensor("int64",BigInt64Array.from(ids.map(BigInt)),[1,T]);
  const text_mask=new ort.Tensor("float32",new Float32Array(T).fill(1),[1,1,T]);
  let t0=performance.now();
  const dr=await S.dp.run({text_ids,style_dp:st.dp,text_mask});const dur=dr[S.dp.outputNames[0]].data[0]/speed;L("  durée prévue : "+dur.toFixed(2)+" s ("+((performance.now()-t0)/1000).toFixed(1)+" s de calcul)");
  t0=performance.now();
  const te=await S.te.run({text_ids,style_ttl:st.ttl,text_mask});const text_emb=te[S.te.outputNames[0]];L("  texte encodé ("+((performance.now()-t0)/1000).toFixed(1)+" s)");
  const SR=44100,CH=512*6,LD=24*6;const wavLen=Math.ceil(dur*SR);const LL=Math.max(1,Math.ceil(wavLen/CH));
  const lat=new Float32Array(LD*LL);for(let i=0;i<lat.length;i++)lat[i]=randn();
  let latent=new ort.Tensor("float32",lat,[1,LD,LL]);const latent_mask=new ort.Tensor("float32",new Float32Array(LL).fill(1),[1,1,LL]);
  t0=performance.now();
  for(let i=0;i<steps;i++){
    const r=await S.ve.run({noisy_latent:latent,text_emb,style_ttl:st.ttl,latent_mask,text_mask,current_step:new ort.Tensor("float32",Float32Array.of(i),[1]),total_step:new ort.Tensor("float32",Float32Array.of(steps),[1])});
    latent=r[S.ve.outputNames[0]];$("st").textContent="Génération : étape "+(i+1)+"/"+steps;}
  L("  génération ("+((performance.now()-t0)/1000).toFixed(1)+" s pour "+steps+" étapes)");
  t0=performance.now();
  const vr=await S.vo.run({latent});const wav=vr[S.vo.outputNames[0]].data;L("  voix synthétisée ("+((performance.now()-t0)/1000).toFixed(1)+" s)");
  const n=Math.min(wav.length,wavLen);const out=new Float32Array(n);out.set(wav.subarray(0,n));return out;
}
function toBuf(w){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const b=ctx.createBuffer(1,w.length,44100);b.getChannelData(0).set(w);return b;}
$("gen").onclick=async()=>{$("gen").disabled=true;stop();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  try{const t0=performance.now();const w=await synth($("t").value.trim()||"Bonjour.",$("v").value);buf=toBuf(w);
    L("OK en "+((performance.now()-t0)/1000).toFixed(1)+" s, audio de "+buf.duration.toFixed(1)+" s");play(cur);}
  catch(e){L("ÉCHEC synthèse : "+(e&&e.message||e));}
  $("gen").disabled=false;};
$("cat").onclick=async()=>{$("cat").disabled=true;$("gen").disabled=true;stop();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();$("cl").innerHTML="";entries=[];
  for(const v of ["M1","M2","M3","M4","M5"]){L("Voix "+v+"…");
    try{const w=await synth($("t").value.trim()||"Bonjour.",v);const b=toBuf(w);entries.push({v,b});
      const btn=document.createElement("button");btn.textContent="▶ "+v;btn.dataset.i=entries.length-1;btn.style.margin="0";$("cl").appendChild(btn);}
    catch(e){L("✘ "+v+" : "+(e&&e.message||e));}}
  L("Catalogue prêt.");$("cat").disabled=false;$("gen").disabled=false;};
$("cl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const en=entries[+b.dataset.i];buf=en.b;play(cur);$("st").textContent="▶ "+en.v+" — "+FXN[cur];};
function stop(){try{src&&src.stop();}catch(_){}src=null;stops.forEach(f=>{try{f()}catch(_){}});stops=[];}
function play(k){if(!buf)return;cur=k;stop();document.querySelectorAll("#fx button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  const s=ctx.createBufferSource();s.buffer=buf;stops=fxBuild(ctx,s,k,ctx.destination,buf.duration);s.start(ctx.currentTime+.02);src=s;}
$("fx").onclick=e=>{const b=e.target.closest("button");if(b)play(b.dataset.k);};
</script></body></html>
