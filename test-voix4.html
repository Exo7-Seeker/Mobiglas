<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test voix Seeker</title>
<style>
body{margin:0;background:#061b26;color:#d2eef3;font:16px system-ui;padding:18px;line-height:1.45}
h2{margin:0 0 6px}p.s{color:#9ccbd8;font-size:14px;margin:4px 0 14px}
label{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6fd3e6}
select,textarea,button{width:100%;box-sizing:border-box;background:#0b3550;color:#e8fdff;border:1px solid #2a7590;border-radius:8px;padding:12px;font-size:16px}
textarea{min-height:84px}button{background:#2a7590;border:0;margin-top:12px}button:disabled{opacity:.5}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fx button{margin:0;background:#0b3550;border:1px solid #2a7590}.fx button.on{background:#6fd3e6;color:#04141f}
#log{white-space:pre-wrap;font:13px ui-monospace,monospace;color:#9ccbd8;margin-top:14px;background:#04141f;padding:10px;border-radius:8px;min-height:60px}
</style></head><body>
<h2>Test voix de Seeker <small style="font-size:12px;color:#6fd3e6">· page v5 (étapes)</small></h2>
<p class="s">Voix générées par le téléphone lui-même (moteur Piper), puis passées dans des filtres. Rien n'est envoyé nulle part.</p>
<label>Voix</label><select id="v"><option>Chargement de la liste…</option></select>
<label>Texte</label><textarea id="t">Constantes stables. Je suis là, Exo. Le point de saut est dégagé, on peut y aller quand tu veux.</textarea>
<button id="gen">1 · Générer la voix</button>
<label>Filtre (touche pour écouter)</label>
<div class="fx" id="fx"></div>
<div id="log">En attente.</div>
<script type="module">
const $=i=>document.getElementById(i),log=t=>{$("log").textContent=t};
let tts=null,buf=null,ctx=null,cur="raw",src=null,tgen=0;
const FX={raw:"Brut",grave:"Grave",robot:"Robot",radio:"Radio de cockpit",echo:"Écho",ia:"IA froide"};
$("fx").innerHTML=Object.entries(FX).map(([k,n])=>`<button data-k="${k}" class="${k==="raw"?"on":""}">${n}</button>`).join("");
const FALL=["fr_FR-siwis-medium","fr_FR-tom-medium","fr_FR-upmc-medium","fr_FR-gilles-low","fr_FR-siwis-low"];
async function init(){
  log("Chargement du moteur de voix (première fois : peut prendre un moment)…");
  try{
    tts=await import("https://esm.sh/@mintplex-labs/piper-tts-web?deps=onnxruntime-web@1.18.0");
  }catch(e){log("Échec du chargement du moteur : "+e.message+"\nEnvoie-moi une capture de cet écran.");return;}
  let list=[];
  try{const v=await tts.voices();const a=Array.isArray(v)?v:Object.values(v);
    list=a.filter(x=>(x.key||x.id||"").startsWith("fr_FR")||(x.language&&x.language.code==="fr_FR")).map(x=>x.key||x.id);}catch(e){}
  if(!list.length)list=FALL;
  $("v").innerHTML=list.map(k=>`<option value="${k}">${k}</option>`).join("");
  log("Moteur prêt. "+list.length+" voix françaises. Choisis une voix, puis « Générer ».");
}
$("gen").onclick=async()=>{
  if(!tts)return;$("gen").disabled=true;stop();
  const id=$("v").value,txt=$("t").value.trim();if(!txt){$("gen").disabled=false;return;}
  const t0=performance.now(),el=()=>((performance.now()-t0)/1000).toFixed(1)+"s";
  let lines=["Voix : "+id,"Isolation cross-origin : "+self.crossOriginIsolated,"Coeurs : "+navigator.hardwareConcurrency];
  const show=()=>log(lines.join("\n"));
  const tick=setInterval(show,500);
  const W=(p,ms,n)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("Délai dépassé ("+ms/1000+" s) à l'étape : "+n)),ms))]);
  window.addEventListener("error",e=>{lines.push("ERREUR JS : "+e.message)});
  window.addEventListener("unhandledrejection",e=>{lines.push("ERREUR PROMESSE : "+(e.reason&&e.reason.message||e.reason))});
  try{
    lines.push("[A] Téléchargement de la voix…");
    let k=lines.length-1;
    await W(tts.download(id,p=>{if(p&&p.total)lines[k]="[A] Téléchargement : "+Math.round(100*p.loaded/p.total)+" % ("+Math.round(p.loaded/1048576)+" Mo) "+el();}),90000,"A téléchargement/stockage");
    lines.push("[A] terminé à "+el());
    lines.push("[B] Synthèse (phonémiseur + moteur)…");
    const wav=await W(tts.predict({text:txt,voiceId:id}),120000,"B synthèse");
    lines.push("[B] terminé à "+el());
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    buf=await ctx.decodeAudioData(await wav.arrayBuffer());
    lines.push("OK ! audio de "+buf.duration.toFixed(1)+" s. Touche un filtre.");
    play(cur);
  }catch(e){lines.push("ÉCHEC : "+(e&&e.message||e));}
  clearInterval(tick);show();
  $("gen").disabled=false;
};
function stop(){try{src&&src.stop();}catch(_){}src=null;}
function noiseIR(c,sec=1.6){const n=c.sampleRate*sec,b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}
function play(k){
  if(!buf)return;cur=k;stop();document.querySelectorAll("#fx button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  const s=ctx.createBufferSource();s.buffer=buf;const out=ctx.destination;
  if(k==="raw"){s.connect(out);}
  else if(k==="grave"){s.playbackRate.value=.82;const lo=ctx.createBiquadFilter();lo.type="lowshelf";lo.frequency.value=250;lo.gain.value=6;s.connect(lo);lo.connect(out);}
  else if(k==="robot"){const g=ctx.createGain();g.gain.value=0;const o=ctx.createOscillator();o.frequency.value=70;o.type="square";const og=ctx.createGain();og.gain.value=.9;o.connect(og);og.connect(g.gain);o.start();s.connect(g);g.connect(out);s.onended=()=>o.stop();}
  else if(k==="radio"){const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=500;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
    const ws=ctx.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*3);}ws.curve=c;const g=ctx.createGain();g.gain.value=.8;
    s.connect(hp);hp.connect(lp);lp.connect(ws);ws.connect(g);g.connect(out);}
  else if(k==="echo"){const d=ctx.createDelay(1);d.delayTime.value=.24;const f=ctx.createGain();f.gain.value=.38;const wet=ctx.createGain();wet.gain.value=.6;
    s.connect(out);s.connect(d);d.connect(f);f.connect(d);d.connect(wet);wet.connect(out);}
  else if(k==="ia"){s.playbackRate.value=.9;const g=ctx.createGain();g.gain.value=.55;const o=ctx.createOscillator();o.frequency.value=45;o.type="sine";const og=ctx.createGain();og.gain.value=.45;o.connect(og);og.connect(g.gain);o.start();
    const conv=ctx.createConvolver();conv.buffer=noiseIR(ctx);const wet=ctx.createGain();wet.gain.value=.35;const dry=ctx.createGain();dry.gain.value=1;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5000;s.connect(lp);lp.connect(dry);lp.connect(conv);conv.connect(wet);dry.connect(out);wet.connect(out);
    const m=ctx.createGain();m.gain.value=.5;lp.connect(g);g.connect(m);m.connect(out);s.onended=()=>o.stop();}
  s.start();src=s;
}
$("fx").onclick=e=>{const b=e.target.closest("button");if(b)play(b.dataset.k);};
init();
</script></body></html>
