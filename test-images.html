<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test images</title>
<style>body{margin:0;background:#061b26;color:#d2eef3;font:14px system-ui;padding:16px}.r{border-bottom:1px solid #2a7590;padding:10px 0}img{max-width:120px;max-height:80px;display:block}pre{white-space:pre-wrap;font-size:12px;color:#9ccbd8;margin:4px 0}button{background:#2a7590;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px}</style></head><body>
<h3>Test des images</h3><button id="go">Lancer</button><div id="o"></div>
<script>
const L=[["Flareweed", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/ba470bd1-8783-49c4-bdbc-2b5b347cc7c6", "placeholder"], ["Flatcat", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/3f239a7d-2376-4824-826c-9396e211fcf0", "placeholder"], ["Flo-Pets", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/6ea8de52-55dc-4e9d-b16d-557b5d1c6915", "placeholder"], ["Abeni Okon", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/ecf3c66f-41fc-4378-bbc1-bfd30e116546", "placeholder"], ["Adaliz Dayan", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/7820fc11-1387-4016-a91c-aaa67daaf6bc", "placeholder"], ["Emperor Bloom", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/f75aa449-dc2d-442c-a086-fa4986f3f80f", "bon"], ["Fessle ray\u00e9", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/817cdd78-0af9-49c7-a093-fa14c2fd21e5", "bon"], ["Aberdeen Hurston", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/023be114-c59c-4132-ab4e-cc3a22d10694", "bon"], ["Flight-of-Fancy", "https://cig-galactapedia-prod.s3.amazonaws.com/upload/78fbb3ac-b3f3-4a6f-9cf2-f87e41e05a4b", "bon"]];
document.getElementById("go").onclick=async()=>{const o=document.getElementById("o");o.innerHTML="";
for(const [n,u,k] of L){const d=document.createElement("div");d.className="r";d.innerHTML="<b>"+n+"</b> ("+k+")<pre>…</pre>";o.appendChild(d);const pre=d.querySelector("pre");let t="";
 const im=new Image();im.referrerPolicy="no-referrer";await new Promise(r=>{im.onload=r;im.onerror=r;im.src=u;});t+="dimensions : "+im.naturalWidth+"x"+im.naturalHeight+"\n";d.insertBefore(im,pre);
 try{const r=await fetch(u,{method:"HEAD"});t+="HEAD "+r.status+" taille="+r.headers.get("content-length")+" etag="+r.headers.get("etag")+" type="+r.headers.get("content-type")+"\n";}catch(e){t+="HEAD refusé ("+e.message+")\n";}
 pre.textContent=t;}};
</script></body></html>
