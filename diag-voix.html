<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic voix</title>
<body style="font:15px system-ui;background:#0a0f14;color:#cfe;padding:14px">
<h3>Diagnostic téléchargement voix (v1)</h3>
<p>Appuie sur le bouton, attends ~1 minute, puis envoie-moi une capture de toute la page.</p>
<button id=go style="font-size:18px;padding:12px 18px">Lancer le diagnostic</button>
<pre id=log style="white-space:pre-wrap;margin-top:14px"></pre>
<script>
const L=t=>{log.textContent+=t+"\n"};
const HF="https://huggingface.co/diffusionstudio/piper-voices/resolve/main/";
async function T(name,url,opt){
  const t0=performance.now(),ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch(url,Object.assign({signal:ac.signal},opt||{}));
    const dt=Math.round(performance.now()-t0);
    let n=0;
    if(opt&&opt.stream){const rd=r.body.getReader();const t1=performance.now();
      while(performance.now()-t1<10000){const x=await rd.read();if(x.done)break;n+=x.value.length}
      rd.cancel();const s=(performance.now()-t1)/1000;
      L("✔ "+name+" HTTP "+r.status+" ("+dt+" ms) lu "+(n/1048576).toFixed(2)+" Mo en "+s.toFixed(1)+" s = "+(n/1024/s).toFixed(0)+" Ko/s");
    }else{const b=await r.arrayBuffer();L("✔ "+name+" HTTP "+r.status+" "+b.byteLength+" octets, "+Math.round(performance.now()-t0)+" ms")}
  }catch(e){L("✘ "+name+" : "+(e.name==="AbortError"?"aucune réponse en 15 s":e.message))}
  clearTimeout(to);
}
go.onclick=async()=>{go.disabled=true;log.textContent="";
  L("Stockage OPFS : "+(navigator.storage&&navigator.storage.getDirectory?"disponible":"ABSENT"));
  L("Connexion : "+(navigator.connection?navigator.connection.effectiveType+" ~"+navigator.connection.downlink+" Mbps":"inconnue"));
  await T("1 GitHub (ton site)",location.origin+"/Mobiglas/index.html");
  await T("2 jsDelivr (phonémiseur)","https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.wasm");
  await T("3 cdnjs (onnxruntime)","https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/ort-wasm-simd-threaded.wasm");
  await T("4 HuggingFace petit fichier (json voix)",HF+"fr/fr_FR/gilles/low/fr_FR-gilles-low.onnx.json");
  await T("5 HuggingFace voix siwis-low (10 s de test)",HF+"fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx",{stream:true});
  await T("6 HuggingFace voix gilles-low (10 s de test)",HF+"fr/fr_FR/gilles/low/fr_FR-gilles-low.onnx",{stream:true});
  L("\nTerminé.");go.disabled=false};
</script></body></html>
