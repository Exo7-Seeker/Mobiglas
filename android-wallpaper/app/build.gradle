plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.exo.fond3d'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.exo.fond3d'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }

    // Clé de signature : JAMAIS dans le dépôt. Fournie par les secrets GitHub (FOND3D_KEYSTORE_B64, FOND3D_KEYSTORE_MDP)
    // et décodée dans un fichier temporaire par le workflow. Sans eux (build local), la release est signée en debug.
    signingConfigs {
        fixe {
            def ks = System.getenv('FOND3D_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('FOND3D_KEYSTORE_MDP')
                keyAlias 'fond3d'
                keyPassword System.getenv('FOND3D_KEYSTORE_MDP')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('FOND3D_KEYSTORE') ? signingConfigs.fixe : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
